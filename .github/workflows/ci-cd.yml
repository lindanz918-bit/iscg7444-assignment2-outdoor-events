name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install microservice dependencies
        run: |
          cd microservice
          pip install -r requirements.txt

      - name: Build Docker images
        run: |
          docker build -t outdoor-events-backend ./backend
          docker build -t outdoor-events-microservice ./microservice
          docker build -t outdoor-events-frontend ./frontend

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest

      - name: Install microservice dependencies
        run: |
          cd microservice
          pip install -r requirements.txt

      - name: Run microservice tests
        run: |
          cd microservice
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/outdoor-events-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/outdoor-events-backend:latest

      - name: Build and push microservice image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/outdoor-events-microservice:latest ./microservice
          docker push ${{ secrets.DOCKER_USERNAME }}/outdoor-events-microservice:latest

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/outdoor-events-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/outdoor-events-frontend:latest

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add deployment commands here (e.g., SSH to server, kubectl apply, etc.)
